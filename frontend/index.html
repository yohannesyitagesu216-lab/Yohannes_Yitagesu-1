<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgroVision AI - Intelligent Crop Disease Detection and Farm Management" />
    <title>AgroVision - Intelligent Farming Solutions</title>
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('agrovision-theme');
          const preferredTheme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light';
          document.documentElement.setAttribute('data-theme', preferredTheme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
